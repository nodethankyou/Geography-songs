<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101426"><title>My Music | Music Player</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#0b1020;color:#f5f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#25335b 0%,#101628 45%,#0b1020 100%)}main{max-width:820px;margin:auto;padding:32px 18px 80px}header{margin-bottom:28px}header small{color:#9faad1;letter-spacing:.2em;font-weight:700}h1{font-size:clamp(30px,6vw,46px);margin:8px 0}header p,.muted{color:#aab5d1}.player,.library{border:1px solid #38435e;background:#171f34dc;border-radius:24px;padding:24px;box-shadow:0 20px 60px #05091466}.player{text-align:center}.art{width:min(210px,60vw);aspect-ratio:1;margin:0 auto 22px;border-radius:22px;background:linear-gradient(135deg,#8870f9,#34c8cf);display:grid;place-items:center;font-size:85px;box-shadow:0 18px 38px #0006}h2{margin:0 0 6px;font-size:25px}#artist{margin:0 0 20px;color:#b9c5e0}input[type=range]{width:100%;accent-color:#a799ff;cursor:pointer}.times{display:flex;justify-content:space-between;font-size:13px;color:#b6c1d9;margin-top:5px}.controls{display:flex;justify-content:center;gap:13px;align-items:center;margin:18px 0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #c2b5ff;outline-offset:3px}.round{background:#27334d;border:1px solid #475573;border-radius:50%;width:49px;height:49px;font-size:21px}.primary{width:66px;height:66px;background:#aa97ff;color:#11162a;border:0;border-radius:50%;font-size:27px;font-weight:700}.round[aria-pressed=true]{background:#6256a1}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:#c5cee4}.volume{display:flex;align-items:center;gap:8px}.volume input{width:110px}.library{margin-top:22px;padding:20px}.library h3{margin:0 0 15px}.track{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;border:0;border-radius:12px;padding:13px 12px}.track:hover,.track.active{background:#303b58}.num{width:24px;color:#a6b2d0}.trackinfo{flex:1;min-width:0}.trackinfo strong,.trackinfo small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trackinfo small{color:#aebad2;margin-top:3px}.track.active strong{color:#c6b9ff}.status{min-height:20px;color:#f5b6b6;font-size:13px;margin-top:12px}.hint{color:#aebad2;font-size:13px;line-height:1.7;margin-top:18px}code{background:#28334c;border-radius:5px;padding:2px 5px}@media(max-width:450px){.player{padding:22px 16px}.library{padding:14px}.bottom{flex-wrap:wrap;justify-content:center}}
</style></head><body><main><header><small>地理　復習ソング</small><h1>系統地理2026</h1><p>UNO MUSIC</p></header><section class="player" aria-label="音楽プレーヤー"><div class="art" aria-hidden="true">
  <img src="uno.png" alt="" class="cover-image">
</div><h2 id="title">前期の復習</h2><input type="range" id="seek" min="0" max="100" value="0" aria-label="再生位置"><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div><div class="controls"><button class="round" id="shuffle" aria-label="シャッフル" aria-pressed="false">⤨</button><button class="round" id="prev" aria-label="前の曲">⏮</button><button class="primary" id="play" aria-label="再生">▶</button><button class="round" id="next" aria-label="次の曲">⏭</button><button class="round" id="repeat" aria-label="リピート" aria-pressed="false">↻</button></div><div class="bottom"><span id="count">0 曲</span><label class="volume">音量 <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="音量"></label></div><p class="status" id="status" role="status"></p><audio id="audio" preload="metadata"></audio></section><section class="library"><h3>TRACK LIST</h3><div id="tracks"></div></section></main><script>
'use strict';
// ▼ 曲を追加・変更する場所。file は music フォルダーからの相対パス。
const songs = [
  { title: '第1週', artist: 'アーティスト名', file: 'music/song1.mp3' },
  { title: '第2週', artist: 'アーティスト名', file: 'music/song2.mp3' },
  { title: '第3週', artist: 'アーティスト名', file: 'music/song3.mp3' },
  { title: '第4週', artist: 'アーティスト名', file: 'music/song4.mp3' },
{ title: '第5週', artist: 'アーティスト名', file: 'music/song5.mp3' },
  { title: '第6週', artist: 'アーティスト名', file: 'music/song6.mp3' },
  { title: '第7週', artist: 'アーティスト名', file: 'music/song7.mp3' },
  { title: '第8週', artist: 'アーティスト名', file: 'music/song8.mp3' },
{ title: '第9週', artist: 'アーティスト名', file: 'music/song9.mp3' },
  { title: '第10週', artist: 'アーティスト名', file: 'music/song10.mp3' },
  { title: '第11週', artist: 'アーティスト名', file: 'music/song11.mp3' },

];
const $=id=>document.getElementById(id), audio=$('audio');let index=-1,shuffle=false,repeat=false;
const format=t=>Number.isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00';
function render(){const list=$('tracks');list.replaceChildren();songs.forEach((s,i)=>{const b=document.createElement('button');b.className='track'+(i===index?' active':'');b.setAttribute('aria-label',`${s.title} を再生`);const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const info=document.createElement('span');info.className='trackinfo';const name=document.createElement('strong');name.textContent=s.title;info.append(name);b.append(n,info);b.addEventListener('click',()=>load(i,true));list.append(b)});$('count').textContent=`${songs.length} 曲`}
async function play(){if(!songs.length)return;if(index<0)load(0,false);try{await audio.play();$('status').textContent=''}catch(e){if(e.name!=='AbortError')$('status').textContent='再生できません。ファイル名・配置・形式を確認してください。'}}
function load(i,autoplay){if(!songs.length)return;index=(i+songs.length)%songs.length;audio.src=songs[index].file;$('title').textContent=songs[index].title;$('seek').value=0;$('current').textContent='0:00';$('duration').textContent='0:00';$('status').textContent='';render();if(autoplay)play()}
function step(d){if(!songs.length)return;if(shuffle&&songs.length>1){let n;do{n=Math.floor(Math.random()*songs.length)}while(n===index);load(n,true)}else load((index<0?0:index+d+songs.length)%songs.length,true)}
$('play').addEventListener('click',()=>audio.paused?play():audio.pause());$('prev').addEventListener('click',()=>step(-1));$('next').addEventListener('click',()=>step(1));$('shuffle').addEventListener('click',()=>{shuffle=!shuffle;$('shuffle').setAttribute('aria-pressed',String(shuffle))});$('repeat').addEventListener('click',()=>{repeat=!repeat;$('repeat').setAttribute('aria-pressed',String(repeat))});$('volume').addEventListener('input',e=>audio.volume=Number(e.target.value));$('seek').addEventListener('input',e=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(e.target.value)/100});audio.addEventListener('timeupdate',()=>{$('current').textContent=format(audio.currentTime);$('seek').value=audio.duration?String(audio.currentTime/audio.duration*100):'0'});audio.addEventListener('loadedmetadata',()=>{$('duration').textContent=format(audio.duration)});audio.addEventListener('play',()=>{$('play').textContent='❚❚';$('play').setAttribute('aria-label','一時停止')});audio.addEventListener('pause',()=>{$('play').textContent='▶';$('play').setAttribute('aria-label','再生')});audio.addEventListener('ended',()=>{if(repeat)load(index,true);else if(shuffle)step(1);else if(index<songs.length-1)load(index+1,true);else{$('play').textContent='▶';$('play').setAttribute('aria-label','再生')}});audio.addEventListener('error',()=>{$('status').textContent='音楽ファイルを読み込めません。music フォルダーとファイル名を確認してください。'});audio.volume=.8;render();
</script></body></html>
